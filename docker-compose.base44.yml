# Base44 development environment for Horizon Properties.
#
# Runs the app straight from the cloned source (bind mounts + dev servers), so
# every edit is picked up without rebuilding an image. The public entry point is
# host port 3000 (the Vite dev server); API requests are proxied from Vite to
# the internal `api` service, keeping the browser on a single origin.
services:
  api:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        CI=true npm ci --no-audit --no-fund
        exec node --watch index.js
    environment:
      - BASE44_PREVIEW_MODE
      - PORT=8000
      - DATA_DIR=/app/data
    volumes:
      - ./server:/app
      - api_node_modules:/app/node_modules
      - api_data:/app/data
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        CI=true npm ci --no-audit --no-fund
        exec npm run dev
    environment:
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts so the preview proxy host
      # is accepted. Value is provided by the platform.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./client:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(async (r) => { const t = await r.text(); process.exit(r.ok && t.includes('root') ? 0 : 1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 120s

volumes:
  api_node_modules:
  api_data:
  web_node_modules:
