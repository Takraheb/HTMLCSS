# Minimal nginx config for the Base44 sandbox preview.
#
# Why a custom config instead of the image default:
#   The sandbox bind-mounts the repository read-only at mode 700 owned by root,
#   so the image's default worker user (`nginx`, uid 101) cannot traverse the
#   document root and every request returns 403. The workers run as root here,
#   which is acceptable because this only ever serves static files inside the
#   sandbox container.
user root;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # All files are UTF-8. Some pages (form1.html, the gallery) have no
    # <meta charset> of their own, so without this header the browser guesses
    # Windows-1252 and the Persian text renders as mojibake.
    charset utf-8;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # The document root is the whole checkout, so keep the repository's
        # metadata (.git, .base44) out of the served output.
        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
